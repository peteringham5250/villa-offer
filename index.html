<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Match Invite</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    margin: 0; padding: 24px;
    background: #f5f2f4; color: #1a1a1a;
    display: flex; justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1418; color: #f0e8ec; }
    .card { background: #2a1f25 !important; }
    /* Claret fails contrast on the dark card — sky blue carries the brand */
    h1 { color: #94BEE5 !important; }
    textarea { background: #1c1418 !important; color: #f0e8ec !important; border-color: #4a3a42 !important; }
  }
  .card {
    max-width: 420px; width: 100%;
    background: white; border-radius: 16px;
    padding: 24px; box-shadow: 0 4px 24px rgba(103,14,54,.15);
  }
  h1 { color: #670E36; font-size: 1.3rem; margin: 0 0 4px; }
  .detail { margin: 12px 0; line-height: 1.5; }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; opacity: .6; }
  a.calendar-link {
    display: block; width: 100%; margin: 14px 0; padding: 12px;
    font-size: .95rem; font-weight: 600; border-radius: 12px;
    text-align: center; text-decoration: none; box-sizing: border-box;
    background: transparent; color: #670E36; border: 1.5px solid #670E36;
  }
  @media (prefers-color-scheme: dark) {
    a.calendar-link { color: #94BEE5; border-color: #94BEE5; }
  }
  textarea {
    width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px;
    font: inherit; border-radius: 10px; border: 1px solid #d8cfd4; resize: vertical;
  }
  button {
    display: block; width: 100%; margin: 10px 0; padding: 14px;
    font-size: 1rem; font-weight: 600; border: none; border-radius: 12px;
    cursor: pointer; background: #670E36; color: white;
  }
  button:active { background: #94BEE5; color: #670E36; }
  button.secondary { background: #94BEE5; color: #670E36; }
  button.decline { background: #e5e0e3; color: #1a1a1a; }
  #status { margin-top: 16px; font-weight: 600; text-align: center; }
  #auth { margin-top: 16px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Loading invite…</h1>
  <div id="details" class="hidden">
    <div class="detail"><span class="label">Kickoff</span><br><span id="kickoff"></span></div>
    <div class="detail"><span class="label">Ground</span><br><span id="venue"></span></div>
    <div class="detail" id="lunchBlock"><span class="label">Meal first</span><br><span id="lunch"></span></div>
    <div class="detail" id="noteBlock"><span class="label">Your ticket</span><br><span id="note"></span></div>
    <a id="calendarLink" class="calendar-link" href="#">📅 Add to Calendar</a>
    <div id="buttons">
      <p>Can you make it?</p>
      <textarea id="messageBox" rows="2" placeholder="Message back to Peter (optional)"></textarea>
      <button onclick="respond('acceptedBoth')">🍽️⚽️ Meal + game</button>
      <button class="secondary" onclick="respond('gameOnly')">⚽️ Game only</button>
      <button class="decline" onclick="respond('declinedBoth')">🙁 Can't make it</button>
    </div>
    <div id="auth" class="hidden">
      <p>Sign in with your Apple ID to send your reply:</p>
      <div id="apple-sign-in-button"></div>
    </div>
  </div>
  <div id="status"></div>
</div>

<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js" async
        onload="boot()"></script>
<script>
// ── One-time setup (see web/README.md) ──────────────────────────────────
// 1. Paste the API token you generate in the CloudKit Dashboard.
// 2. Match the environment to the build that wrote the record:
//    'development' for Xcode-run builds, 'production' for TestFlight/App Store.
const API_TOKEN = '3a00f70bea0e4d895a7f798e72510e37b9fde816d2489174c353580374186e86';
const ENVIRONMENT = 'development';
const CONTAINER = 'iCloud.com.peteringham.VillaInghamTickets';
// ────────────────────────────────────────────────────────────────────────

let pendingResponse = null;
let recordName = null;
let currentUser = null;

function boot() {
  recordName = new URLSearchParams(location.search).get('id');
  if (!recordName) { setTitle('Invalid invite link'); return; }
  if (API_TOKEN.startsWith('PASTE')) { setTitle('Page not configured yet'); return; }

  CloudKit.configure({
    containers: [{
      containerIdentifier: CONTAINER,
      apiTokenAuth: { apiToken: API_TOKEN, persist: true,
                      signInButton: { id: 'apple-sign-in-button', theme: 'black' } },
      environment: ENVIRONMENT
    }]
  });
  loadOffer();

  const container = CloudKit.getDefaultContainer();
  container.setUpAuth().then(user => {
    handleSignIn(user);
    if (!user) {
      container.whenUserSignsIn().then(handleSignIn).catch(() => {});
    }
  }).catch(() => {});
}

function handleSignIn(user) {
  currentUser = user || null;
  if (currentUser) {
    document.getElementById('auth').classList.add('hidden');
    if (pendingResponse) sendReply(pendingResponse);
  }
}

function db() { return CloudKit.getDefaultContainer().publicCloudDatabase; }
function setTitle(t) { document.getElementById('title').textContent = t; }
function setStatus(t) { document.getElementById('status').textContent = t; }

// YYYYMMDDTHHMMSSZ in UTC, as required by the .ics format.
function icsDate(date) {
  return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
}

function buildCalendarLink(f) {
  const start = new Date(f.kickoff.value);
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000); // 2-hour default
  const location = f.venueName.value + (f.venueAddress.value ? ', ' + f.venueAddress.value : '');
  let description = f.competition.value;
  if (f.lunchVenue && f.lunchVenue.value) {
    description += '\\nMeal first: ' + f.lunchVenue.value;
  }
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Villa Ingham Tickets//EN',
    'BEGIN:VEVENT',
    'UID:' + recordName + '@villa-offer',
    'DTSTAMP:' + icsDate(new Date()),
    'DTSTART:' + icsDate(start),
    'DTEND:' + icsDate(end),
    'SUMMARY:' + f.fixtureTitle.value,
    'LOCATION:' + location,
    'DESCRIPTION:' + description,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  document.getElementById('calendarLink').href =
    'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}

function loadOffer() {
  db().fetchRecords(recordName).then(resp => {
    if (resp.hasErrors) { setTitle('Invite not found'); return; }
    const f = resp.records[0].fields;
    setTitle(f.fixtureTitle.value + ' — ' + f.competition.value);
    document.getElementById('kickoff').textContent =
      new Date(f.kickoff.value).toLocaleString(undefined,
        { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    document.getElementById('venue').textContent =
      f.venueName.value + (f.venueAddress.value ? ' · ' + f.venueAddress.value : '');
    if (f.lunchVenue && f.lunchVenue.value) {
      let lunch = f.lunchVenue.value;
      if (f.lunchTime) lunch += ' at ' + new Date(f.lunchTime.value)
        .toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      if (f.lunchAddress.value) lunch += ' · ' + f.lunchAddress.value;
      document.getElementById('lunch').textContent = lunch;
    } else {
      document.getElementById('lunchBlock').classList.add('hidden');
    }
    if (f.handoverNote && f.handoverNote.value) {
      document.getElementById('note').textContent = f.handoverNote.value;
    } else {
      document.getElementById('noteBlock').classList.add('hidden');
    }
    buildCalendarLink(f);
    if (f.message && f.message.value) {
      document.getElementById('messageBox').value = f.message.value;
    }
    document.getElementById('details').classList.remove('hidden');
    if (f.response.value && f.response.value !== 'pending') {
      showDone(f.response.value);
    }
  });
}

function respond(value) {
  pendingResponse = value;
  if (!currentUser) {
    // Not signed in yet — show the Apple sign-in button; the reply is sent
    // automatically once sign-in completes (see handleSignIn).
    document.getElementById('auth').classList.remove('hidden');
    setStatus('Sign in above to send your reply.');
    document.getElementById('auth').scrollIntoView({ behavior: 'smooth' });
    return;
  }
  sendReply(value);
}

function sendReply(value) {
  setStatus('Sending your reply…');
  const message = document.getElementById('messageBox').value.trim();
  db().fetchRecords(recordName).then(resp => {
    if (resp.hasErrors) { throw resp.errors[0]; }
    const record = resp.records[0];
    record.fields.response = { value: value };
    record.fields.message = { value: message };
    return db().saveRecords(record);
  }).then(resp => {
    if (!resp || resp.hasErrors) { throw (resp && resp.errors[0]) || new Error('save failed'); }
    pendingResponse = null;
    showDone(value);
  }).catch(err => {
    const code = err && (err.ckErrorCode || err.serverErrorCode);
    if (code === 'ACCESS_DENIED' || code === 'PERMISSION_VIOLATION') {
      setStatus('⚠️ Reply blocked by permissions — tell Pete his CloudKit settings need the _icloud Write box ticked.');
    } else if (code === 'AUTHENTICATION_REQUIRED' || code === 'AUTH_PERSIST_ERROR') {
      currentUser = null;
      document.getElementById('auth').classList.remove('hidden');
      setStatus('Sign in above to send your reply.');
    } else {
      setStatus('⚠️ Couldn’t send your reply (' + (code || 'network error') + ') — try again.');
    }
  });
}

function showDone(value) {
  document.getElementById('buttons').classList.add('hidden');
  document.getElementById('auth').classList.add('hidden');
  const labels = {
    acceptedBoth: '✅ You’re in for the meal and the game — see you there!',
    gameOnly: '🎟️ You’re in for the game (skipping the meal).',
    declinedBoth: '🙁 Reply sent — maybe next time!'
  };
  setStatus(labels[value] || 'Reply recorded.');
}
</script>
</body>
</html>
